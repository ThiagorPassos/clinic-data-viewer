<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Acesso de Emergência</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.2/mdb.min.css" rel="stylesheet" />
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow-5-strong" style="width: 22rem;">
        <div class="card-body text-center mt-3">
            <h4 class="card-title text-danger mb-4">Acesso Médico Restrito</h4>
            <p class="text-muted mb-4">Insira o PIN de segurança do paciente para visualizar os dados clínicos.</p>

            {% if erro %}
                <div class="alert alert-danger" role="alert">
                    {{ erro }}
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="form-outline mb-4">
                    <input type="password" id="pin" name="pin" class="form-control form-control-lg" required maxlength="6" />
                    <label class="form-label" for="pin">PIN de Segurança</label>
                </div>
                <button type="submit" class="btn btn-danger btn-block btn-lg">Desbloquear Dados</button>
            </form>
        </div>
    </div>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.2/mdb.min.js"></script>
</body>
</html>
