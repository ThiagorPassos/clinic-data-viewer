<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Criar Conta - Clinic Data Viewer</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.2/mdb.min.css" rel="stylesheet" />
    <style>
        form p { text-align: left; margin-bottom: 1rem; }
        form input { display: block; width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #bdbdbd; border-radius: 0.25rem; }
        form ul { color: #dc4c64; list-style: none; padding: 0; font-size: 0.85em; text-align: left;}
        form .helptext { font-size: 0.8em; color: #757575; display: block; margin-top: 0.25rem; }
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-5-strong my-5" style="width: 28rem;">
        <div class="card-body text-center p-5">
            <h4 class="card-title mb-4">Criar nova conta</h4>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success btn-block btn-lg mt-4">Cadastrar</button>
            </form>

            <hr class="mt-4">
            <a href="{% url 'login' %}">Voltar para o Login</a>
        </div>
    </div>
</body>
</html>
