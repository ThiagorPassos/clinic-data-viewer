version: '3.8'

services:
  db:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./clinicDataViewer
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./clinicDataViewer:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
